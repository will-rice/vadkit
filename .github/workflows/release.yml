name: Release

# release-please turns conventional commits on main into a running release
# PR (version bump + CHANGELOG). Merging that PR creates the tag and GitHub
# release and publishes to npm — all in this workflow, because releases
# created with the workflow's own token do not trigger other workflows.
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags + releases
      pull-requests: write # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5, which ships with Node 24.
          node-version-file: .nvmrc
          cache: npm
          # No registry-url: it writes an .npmrc _authToken line that makes
          # npm think credentials are configured and skip the OIDC exchange
          # trusted publishing depends on.
      - run: npm ci
      # prepublishOnly runs typecheck, the parity suite, and the build
      # (with publint + attw) before anything reaches the registry.
      - run: npm publish
