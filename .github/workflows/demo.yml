name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
      - run: npm ci
      - run: npx vp build demo --base /vadkit/
      - uses: actions/configure-pages@v5
        with:
          enablement: true # creates the Pages site on first run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
      - uses: actions/deploy-pages@v4
        id: deployment
