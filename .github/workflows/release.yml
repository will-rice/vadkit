name: Release

# semantic-release analyzes conventional commits on every push to main:
# when they warrant a release it computes the version, updates CHANGELOG.md
# and package.json (committed back with [skip ci]), tags, creates the
# GitHub release, and publishes to npm — all in one run, after the quality
# gate below has passed. Config in .releaserc.json; pre-1.0, breaking
# changes bump the minor version.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time: two overlapping runs would both compute the same
# next version. A release under way is never cancelled; the newest push
# waits for it, and GitHub keeps only the latest waiting run. That run
# checks out the tip of main as it is when the run starts, not the commit
# that triggered it, so it gates and releases everything on main by then.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, the GitHub release, and the release commit
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch tip, not the push's SHA: a run that waited behind
          # another release starts after that release's commit reached main,
          # and semantic-release publishes nothing (and exits 0) from a
          # checkout that is behind the remote branch.
          ref: ${{ github.ref }}
          fetch-depth: 0 # semantic-release reads the full history and tags
      - uses: actions/setup-node@v7
        with:
          # .nvmrc (Node 24) bundles the npm >= 11.5 that trusted
          # publishing needs; bump it deliberately rather than tracking latest.
          node-version-file: .nvmrc
          cache: npm
          # No registry-url: it writes an .npmrc _authToken line that makes
          # npm think credentials are configured and skip the OIDC exchange
          # trusted publishing depends on (no NPM_TOKEN is set anywhere).
      - run: npm ci
      # semantic-release pushes the tag and the release commit before it
      # publishes, so a check that first fails inside `npm publish`
      # (prepublishOnly) leaves a version tagged but never on npm. Run the
      # same gate here first: typecheck, the full suite (Node and Chromium
      # projects, so the browser must exist on this runner), and the build
      # (with publint + attw). prepublishOnly repeats it at publish time.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
