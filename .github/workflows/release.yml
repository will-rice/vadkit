name: Release

# semantic-release analyzes conventional commits on every push to main:
# when they warrant a release it computes the version, updates CHANGELOG.md
# and package.json (committed back with [skip ci]), tags, creates the
# GitHub release, and publishes to npm — all in one run. Config in
# .releaserc.json; pre-1.0, breaking changes bump the minor version.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, the GitHub release, and the release commit
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release reads the full history and tags
      - uses: actions/setup-node@v7
        with:
          # .nvmrc (Node 24) bundles the npm >= 11.5 that trusted
          # publishing needs; bump it deliberately rather than tracking latest.
          node-version-file: .nvmrc
          cache: npm
          # No registry-url: it writes an .npmrc _authToken line that makes
          # npm think credentials are configured and skip the OIDC exchange
          # trusted publishing depends on (no NPM_TOKEN is set anywhere).
      - run: npm ci
      # prepublishOnly runs typecheck, the full suite (Node and Chromium
      # projects), and the build (with publint + attw) before anything
      # reaches the registry, so the browser must exist on this runner.
      - run: npx playwright install --with-deps chromium
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
